name: Java CI wth Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

          # Install virtual display tools for macOS and Linux
      - name: Install virtual display (Linux - Xvfb, macOS alternative)
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            sudo apt-get update
            sudo apt-get install -y xvfb
            Xvfb :99 &  # Start a virtual display on display 99
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            echo "macOS detected, skipping XQuartz installation"
          fi
      

      - name: Set DISPLAY environment variable
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            export DISPLAY=:99 
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            export DISPLAY=:0
          fi

      - name: Build with Gradle (including tests)
        run: |
          export DISPLAY=${DISPLAY} 
          ./gradlew build
