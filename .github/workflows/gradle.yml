name: Java CI wth Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start XQuartz on macOS
        run: |
          if [[ $RUNNER_OS == 'macOS' ]]; then
            # Check if XQuartz is installed (preinstalled on GitHub runners)
            if ! command -v open &>/dev/null; then
              echo "XQuartz not found, skipping start"
            else
              echo "Starting XQuartz"
              open -a XQuartz  # Start the XQuartz server on macOS
              sleep 5  # Give XQuartz some time to start
            fi
          fi

          # Install virtual display tools for macOS and Linux
      - name: Install virtual display (Linux - Xvfb)
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            sudo apt-get update
            sudo apt-get install -y xvfb
            Xvfb :99 &  # Start a virtual display on display 99
          fi
      

      - name: Set DISPLAY environment variable
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            export DISPLAY=:99 
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            export DISPLAY=:0
          fi

      - name: Build with Gradle
        run: |
          export DISPLAY=${DISPLAY} 
          ./gradlew build
